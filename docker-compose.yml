services:

  postgres:
    image: postgres:16

    container_name: sap-sentinel-postgres

    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
      POSTGRES_DB: sentinel

    ports:
      - "5431:5432"

    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data

volumes:
  sentinel_postgres_data: